name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor = oldest supported CPython per devguide.python.org/versions.
        # Full supported range: zero-dep stdlib must pass on every leg.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project + dev group
        run: uv sync --group dev
      - name: Unit tests
        run: uv run pytest -v
      - name: Coverage floor (one matrix leg is enough)
        if: matrix.python-version == '3.14'
        run: uv run pytest -q --cov=slopkeeper --cov-fail-under=75

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install project + dev group
        run: uv sync --group dev
      - name: Ruff (dev group, never a runtime dependency)
        run: uv run ruff check --select E,F src tests
      - name: License check
        run: uv run reuse lint

  # Proves the distribution artifacts install and run with PLAIN pip on the
  # oldest and newest commonly-shipped CPython (Debian 12/RHEL9 floor;
  # current Fedora/Homebrew ceiling). uv is fine for local dev; pip is the
  # compatibility contract.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: uv build
      - name: Install wheel with plain pip and smoke-test
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/pip install --no-deps dist/*.whl
          wheel-venv/bin/slopkeeper --version
          wheel-venv/bin/slopkeeper strategies show hybrid > /dev/null
      - name: Install sdist with plain pip and smoke-test
        run: |
          python -m venv sdist-venv
          sdist-venv/bin/pip install --no-deps dist/*.tar.gz
          sdist-venv/bin/slopkeeper --version
      - name: Check metadata (entry point, requires-python, no runtime deps)
        run: python bin/check-metadata
